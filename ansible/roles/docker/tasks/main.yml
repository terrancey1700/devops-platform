---
- name: Install Docker
  ansible.builtin.dnf:
    name: "{{ docker_package_name }}"
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    enabled: true
    state: started

- name: Add approved users to the Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - docker
    append: true
  loop: "{{ docker_users }}"