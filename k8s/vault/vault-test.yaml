apiVersion: v1
kind: Pod
metadata:
  name: vault-test
  namespace: default
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "devops-app"
    vault.hashicorp.com/agent-inject-secret-creds.txt: "secret/data/devops-app"
spec:
  serviceAccountName: devops-app
  containers:
    - name: app
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]
