apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-green

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginx
      version: green

  template:
    metadata:
      labels:
        app: nginx
        version: green

    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
