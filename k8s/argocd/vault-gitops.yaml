apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/terrancey1700/devops-platform.git
    targetRevision: feature
    path: k8s/vault

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
